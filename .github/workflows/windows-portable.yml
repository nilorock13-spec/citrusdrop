name: Build CitrusDrop v2 Windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -r requirements.txt pyinstaller
      - name: Build drag and drop desktop EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all tkinterdnd2 --name CitrusDrop app.py
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: CitrusDrop-v2-Windows
          path: dist/CitrusDrop.exe
